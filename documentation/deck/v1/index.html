<!DOCTYPE html>

<title>The plan, step by step — Todak AI Creator Program</title>
<meta name="description" content="A fifteen-step presentation of the Todak AI Creator Program Game Track plan, in English and Bahasa Malaysia, with the Arcade animations of the student’s screen.">
<style>
  :root {

      --method: #86b2ce; --method-soft: rgba(134,178,206,.13);
      --crew: #d2a052; --crew-soft: rgba(210,160,82,.14);
      --ship: #5cbf95; --ship-soft: rgba(92,191,149,.14);

  :root[data-theme="dark"] {
    --bg: #0c0e11; --surface: #14181d; --surface-2: #1a1f25; --line: #2a3138; --line-soft: #21272d;
    --ink: #e7eaed; --ink-soft: #9aa4ad; --ink-faint: #69737c;

    --crew: #d2a052; --crew-soft: rgba(210,160,82,.14);

  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { scroll-behavior: smooth; }

  body {

  .sec-head h2 { font-size: 22px; font-weight: 760; letter-spacing: -.015em; }
  .sec-sub { color: var(--ink-soft); font-size: 14.5px; margin: 4px 0 20px; max-width: 740px; }
  h3 { font-size: 15.5px; font-weight: 700; margin: 24px 0 8px; letter-spacing: -.01em; }

  pre { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 12.5px; line-height: 1.55; background: var(--surface-2); border: 1px solid var(--line); border-radius: 9px; padding: 13px 15px; overflow-x: auto; margin: 0 0 14px; max-width: 740px; }
  pre code { background: none; border: 0; padding: 0; font-size: inherit; }

  /* tables (same look as the module spec) */

  table.cp tbody tr:last-child td { border-bottom: none; }
  table.cp .num { font-variant-numeric: tabular-nums; white-space: nowrap; }

  .type-pill.action { color: var(--method); background: var(--method-soft); }

  .type-pill.story { color: var(--crew); background: var(--crew-soft); }
  .type-pill.sim { color: var(--ship); background: var(--ship-soft); }

  /* callouts */
  .note { background: var(--surface); border: 1px solid var(--line); border-left: 3px solid var(--method); border-radius: 0 10px 10px 0; padding: 12px 16px; margin: 14px 0 16px; max-width: 760px; font-size: 14.5px; }
  .note.crew { border-left-color: var(--crew); }
  .note.ship { border-left-color: var(--ship); }
  .note p { margin: 0; }

  /* compare */
  .compare { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin: 6px 0 16px; }
  @media (max-width: 640px) { .compare { grid-template-columns: 1fr; } }
  .compare > div { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 16px 18px; box-shadow: var(--shadow); }
  .compare h4 { font-family: ui-monospace, Menlo, monospace; font-size: 10.5px; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-faint); margin-bottom: 8px; }
  .compare .pick { border-color: color-mix(in srgb, var(--method) 55%, transparent); background: var(--method-soft); }
  .compare .pick h4 { color: var(--method); }
  .compare ul { margin: 0; font-size: 14px; }

  /* week strip */
  .weeks { display: grid; grid-template-columns: repeat(12, 1fr); gap: 4px; margin: 6px 0 8px; }
  .weeks div { height: 44px; border-radius: 7px; display: grid; place-items: center; font-family: ui-monospace, Menlo, monospace; font-size: 11px; font-weight: 600; background: var(--surface); border: 1px solid var(--line); color: var(--ink-soft); }
  .weeks .g1 { background: var(--method-soft); border-color: var(--method); color: var(--ink); }
  .weeks .g2 { background: var(--elective-soft); border-color: var(--elective); color: var(--ink); }
  .weeks .g3 { background: var(--crew-soft); border-color: var(--crew); color: var(--ink); }
  .legend { display: flex; flex-wrap: wrap; gap: 8px 18px; margin: 4px 0 16px; }
  .lg { display: inline-flex; align-items: center; gap: 8px; font-size: 12.5px; color: var(--ink-soft); }
  .lg .sw { width: 11px; height: 11px; border-radius: 3px; border: 1px solid var(--line); background: var(--surface); }
  .lg .sw.g1 { background: var(--method-soft); border-color: var(--method); }
  .lg .sw.g2 { background: var(--elective-soft); border-color: var(--elective); }
  .lg .sw.g3 { background: var(--crew-soft); border-color: var(--crew); }

  /* flow */
  .flow { display: grid; grid-template-columns: 1fr auto 1fr auto 1fr; gap: 10px; align-items: stretch; margin: 6px 0 18px; }
  .flow .box { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; font-size: 13.5px; box-shadow: var(--shadow); }
  .flow .box b { display: block; margin-bottom: 4px; }
  .flow .box small { display: block; color: var(--ink-soft); font-size: 12.5px; line-height: 1.45; }
  .flow .arw { display: grid; place-items: center; color: var(--ink-faint); font-size: 18px; }
  .flow .box.mem { border-color: color-mix(in srgb, var(--method) 45%, transparent); background: var(--method-soft); }
  @media (max-width: 720px) { .flow { grid-template-columns: 1fr; } .flow .arw { transform: rotate(90deg); } }

  /* decisions */
  .decisions { list-style: none; display: grid; gap: 9px; margin-top: 6px; }
  .decisions li { display: grid; grid-template-columns: 30px 1fr; gap: 12px; background: var(--surface); border: 1px solid var(--line); border-radius: 11px; padding: 12px 14px; font-size: 14.5px; box-shadow: var(--shadow); }
  .decisions .n { font-family: ui-monospace, Menlo, monospace; font-weight: 700; color: var(--crew); }
  .decisions .rec { display: inline-block; font-family: ui-monospace, Menlo, monospace; font-size: 9.5px; letter-spacing: .06em; text-transform: uppercase; color: var(--ship); background: var(--ship-soft); padding: 2px 7px; border-radius: 999px; margin-left: 6px; vertical-align: 1px; }
  .decisions .done { color: var(--method); background: var(--method-soft); }

  .rec.open { color: var(--crew); background: var(--crew-soft); }
  .lanes { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin: 6px 0 16px; }
  @media (max-width: 640px) { .lanes { grid-template-columns: 1fr; } }
  .lanes > div { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 16px 18px; box-shadow: var(--shadow); }
  .lanes h4 { font-family: ui-monospace, Menlo, monospace; font-size: 10.5px; letter-spacing: .1em; text-transform: uppercase; margin-bottom: 8px; }
  .lanes .astra { border-color: color-mix(in srgb, var(--crew) 55%, transparent); }
  .lanes .astra h4 { color: var(--crew); }
  .lanes .cc { border-color: color-mix(in srgb, var(--method) 55%, transparent); }
  .lanes .cc h4 { color: var(--method); }
  .lanes ul { margin: 0; font-size: 14px; }
  footer { margin-top: 56px; padding-top: 18px; border-top: 1px solid var(--line); display: flex; justify-content: space-between; flex-wrap: wrap; gap: 8px 18px; font-family: ui-monospace, Menlo, monospace; font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-faint); }
  /* deck */
  html, body { height: 100%; }
  body { padding-bottom: 0; overflow: hidden; }
  .dtop { position: fixed; top: 0; left: 0; right: 0; height: 48px; display: flex; align-items: center; justify-content: space-between; padding: 0 16px; border-bottom: 1px solid var(--line); background: var(--bg); z-index: 5; font-family: ui-monospace, Menlo, monospace; font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-faint); gap: 12px; }
  .dtop a { color: var(--ink-soft); text-decoration: none; } .dtop a:hover { color: var(--method); }
  .dtop .ttl { color: var(--method); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .langbtn { font: inherit; letter-spacing: .1em; text-transform: uppercase; padding: 8px 12px; min-height: 36px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); color: var(--ink); cursor: pointer; }
  .langbtn b { color: var(--method); }
  .langbtn:disabled { opacity: .5; cursor: default; }
  .deck { position: absolute; top: 48px; bottom: 72px; left: 0; right: 0; overflow: hidden; }
  .slide { position: absolute; inset: 0; overflow-y: auto; padding: 28px 16px 24px; display: none; }
  .slide.active { display: block; animation: sl .32s ease both; }
  @keyframes sl { from { opacity: 0; transform: translateX(14px) } to { opacity: 1; transform: none } }
  @media (prefers-reduced-motion: reduce) { .slide.active { animation: none; } }
  .inner { max-width: 960px; margin: 0 auto; }
  .kicker { font-family: ui-monospace, Menlo, monospace; font-size: 11px; letter-spacing: .2em; text-transform: uppercase; color: var(--crew); margin-bottom: 14px; }
  .slide h1 { font-size: clamp(28px, 4.6vw, 46px); font-weight: 800; letter-spacing: -.022em; line-height: 1.06; margin-bottom: 18px; text-wrap: balance; }
  .points { list-style: none; padding: 0; margin: 0 0 18px; max-width: 820px; }
  .points li { font-size: clamp(16px, 2.1vw, 21px); line-height: 1.5; margin-bottom: 12px; padding-left: 22px; position: relative; }
  .points li::before { content: ""; position: absolute; left: 0; top: .62em; width: 9px; height: 9px; border-radius: 50%; background: var(--method); }
  .points li b { color: var(--ink); }
  .visual { margin-top: 10px; }
  .bigrow { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; margin: 8px 0 22px; max-width: 720px; }
  .big { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 18px; box-shadow: var(--shadow); text-align: center; }
  .big .n { font-size: clamp(36px, 6vw, 64px); font-weight: 800; letter-spacing: -.03em; color: var(--method); line-height: 1; }
  .big .l { font-family: ui-monospace, Menlo, monospace; font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--ink-faint); margin-top: 8px; }
  .strip { display: flex; gap: 4px; margin: 6px 0 14px; max-width: 900px; }
  .strip div { border-radius: 8px; padding: 10px 8px; font-size: 12px; line-height: 1.3; background: var(--method-soft); border: 1px solid var(--method); min-width: 0; }
  .strip div b { display: block; font-size: 12.5px; } .strip div small { color: var(--ink-soft); display: block; }
  .strip .brk { background: var(--surface); border-color: var(--line); }
  @media (max-width: 640px) { .strip { flex-direction: column; } .strip div { padding: 8px 12px; } }
  .stairs { display: grid; gap: 8px; max-width: 760px; margin: 6px 0 14px; }
  .stairs div { background: var(--surface); border: 1px solid var(--line); border-left: 4px solid var(--ship); border-radius: 10px; padding: 12px 16px; font-size: 15.5px; box-shadow: var(--shadow); }
  .stairs div:nth-child(1) { margin-left: 0 } .stairs div:nth-child(2) { margin-left: 6% } .stairs div:nth-child(3) { margin-left: 12% } .stairs div:nth-child(4) { margin-left: 18% }
  @media (max-width: 640px) { .stairs div { margin-left: 0 !important; } }
  .stairs b { display: block; } .stairs small { color: var(--ink-soft); }
  .buyrows { display: grid; gap: 8px; max-width: 820px; margin: 6px 0 16px; }
  .buyrows div { display: grid; grid-template-columns: 1fr 1.2fr; gap: 14px; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 11px 14px; font-size: 15px; }
  .buyrows div span:last-child { color: var(--ink-soft); }
  @media (max-width: 560px) { .buyrows div { grid-template-columns: 1fr; gap: 2px; } }
  .cols { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; max-width: 900px; }
  @media (max-width: 640px) { .cols { grid-template-columns: 1fr; } }
  .col { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 16px 18px; box-shadow: var(--shadow); }
  .col h3 { margin: 0 0 10px; font-family: ui-monospace, Menlo, monospace; font-size: 11px; letter-spacing: .14em; text-transform: uppercase; }
  .col.ok h3 { color: var(--ship); } .col.open h3 { color: var(--crew); }
  .col ul { margin: 0; padding-left: 18px; font-size: 15.5px; } .col li { margin-bottom: 6px; }
  .linkrow { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 10px; }
  .linkrow a { display: inline-block; padding: 12px 16px; min-height: 44px; border-radius: 10px; border: 1px solid var(--method); background: var(--method-soft); color: var(--ink); text-decoration: none; font-weight: 700; font-size: 15px; }

  .dbot button { min-height: 44px; min-width: 96px; padding: 10px 16px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); font-weight: 700; font-size: 15px; cursor: pointer; }
  .dbot button.primary { border-color: var(--method); background: var(--method-soft); }

  .prog { display: flex; align-items: center; gap: 10px; flex: 1; justify-content: center; min-width: 0; }

  .arcade-storyboard { margin-top: 6px; }
</style>

<div class="dtop">

<main class="deck" id="deck">
<section class="slide" data-id="title" aria-label="1"><div class="inner"><div class="kicker"></div><h1></h1><ul class="points"></ul><div class="visual"></div></div></section>

<section class="slide" data-id="screen" aria-label="4"><div class="inner"><div class="kicker"></div><h1></h1><ul class="points"></ul><div class="visual">    <figure class="arcade" data-arcade="tour" data-beat-ms="2400" aria-labelledby="arcade-tour-heading">
      <figcaption class="arcade-heading" id="arcade-tour-heading">TODAK WORKBENCH <small>One prompt. Five beats. A game that moves.</small></figcaption>
      <svg class="arcade-tour-svg" role="img" aria-labelledby="arcade-tour-title arcade-tour-desc" viewBox="0 0 1000 410" width="1000" height="410" shape-rendering="crispEdges" xmlns="http://www.w3.org/2000/svg">
  <title id="arcade-tour-title">The Todak Workbench screen tour</title>
  <desc id="arcade-tour-desc">Monitor 1 has the Todak sidebar, code in the middle, the closed Design desk and the active Build desk. A student types a paddle request; three lines change; Godot reloads on Monitor 2; Pong plays; the Paddle moves step and saved to memory chip light up.</desc>
  <defs>
    <pattern id="arcade-tour-scan" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="4" height="2" fill="rgba(0,0,0,.22)"/></pattern>
  </defs>

    <!-- sidebar -->
    <rect class="side" x="16" y="16" width="140" height="342" rx="0"/>

(function(){
  const slides=[...document.querySelectorAll('.slide')];
  const dots=document.getElementById('dots'); const counter=document.getElementById('counter');
  const prev=document.getElementById('prev'), next=document.getElementById('next'), langbtn=document.getElementById('langbtn');
  let lang='en'; try { lang = localStorage.getItem('deck-lang') || 'en'; } catch(e) {}
  if (!BM) lang='en';
  let idx=0; const n=slides.length;
  const h=parseInt((location.hash||'').replace('#',''),10); if(h>=1&&h<=n) idx=h-1;
  slides.forEach((s,i)=>{ const b=document.createElement('button'); b.type='button'; b.setAttribute('aria-label','Slide '+(i+1)); b.addEventListener('click',()=>go(i)); dots.appendChild(b); });
  function dict(){ return (lang==='bm'&&BM)?BM:EN; }
  function render(){
    const D=dict(); document.documentElement.lang = lang==='bm'?'ms':'en';
    document.querySelectorAll('[data-ui]').forEach(el=>{ const k=el.dataset.ui; if(D.ui[k]) el.textContent=D.ui[k]; });
    langbtn.querySelector('[data-lang-cur]').textContent=D.ui.lang; langbtn.querySelector('[data-lang-other]').textContent=D.ui.other;
    langbtn.disabled=!BM;
    slides.forEach((s,i)=>{
      const sl=D.slides[i]; s.querySelector('.kicker').textContent=sl.kicker; s.querySelector('h1').innerHTML=sl.title;
      const ul=s.querySelector('.points'); ul.innerHTML=sl.points.map(p=>'<li>'+p+'</li>').join('');
      if(i===0) ul.insertAdjacentHTML('beforeend','<li>'+D.ui.tap+'</li>');
      const v=sl.visual;
      if(v==='big'||sl.big){ const el=s.querySelector('.visual'); el.innerHTML='<div class="bigrow">'+sl.big.map(b=>'<div class="big"><div class="n">'+b[0]+'</div><div class="l">'+b[1]+'</div></div>').join('')+'</div>'; }
      if(v==='lesson'){ const tot=sl.lesson.reduce((a,r)=>a+parseInt(r[2],10),0); s.querySelector('.vis-lesson').innerHTML='<div class="strip">'+sl.lesson.map(r=>'<div class="'+(/Break|Rehat/.test(r[1])?'brk':'')+'" style="flex:'+parseInt(r[2],10)/tot*100+' 1 0"><b>'+r[1]+'</b><small>'+r[0]+' · '+r[2]+'</small></div>').join('')+'</div>'; }
      if(v==='ladder'){ s.querySelector('.vis-ladder').innerHTML='<div class="stairs">'+sl.ladder.map(r=>'<div><b>'+r[0]+'</b><small>'+r[1]+'</small></div>').join('')+'</div>'; }
      if(v==='buy'){ s.querySelector('.vis-buy').innerHTML='<div class="buyrows">'+sl.buy.map(r=>'<div><span>'+r[0]+'</span><span>'+r[1]+'</span></div>').join('')+'</div>'; }
      if(v==='status'){ s.querySelector('.vis-status').innerHTML='<div class="cols"><div class="col ok"><h3>'+(lang==='bm'?'Sudah diputuskan':'Decided')+'</h3><ul>'+sl.decided.map(x=>'<li>'+x+'</li>').join('')+'</ul></div><div class="col open"><h3>'+(lang==='bm'?'Masih terbuka':'Still open')+'</h3><ul>'+sl.open.map(x=>'<li>'+x+'</li>').join('')+'</ul></div></div>'; }
      if(v==='links'){ s.querySelector('.vis-links').innerHTML='<div class="linkrow"><a href="/documentation/summary/v1/">'+D.ui.summary+'</a><a href="/documentation/classroom/v2/">'+D.ui.classroom+'</a><a href="/documentation/">'+D.ui.docs+'</a></div>'; }
    });
    Object.keys(D.captions||{}).forEach(k=>{
      if(k.endsWith('_heading')) { const f=document.querySelector('[data-arcade="'+k.replace('_heading','')+'"] figcaption'); if(f) f.innerHTML=D.captions[k]; return; }
      const caps=document.querySelectorAll('[data-arcade="'+k+'"] .arcade-caption'); D.captions[k].forEach((c,i)=>{ if(caps[i]) caps[i].innerHTML=c; });
    });
  }
  function go(i){ idx=Math.max(0,Math.min(n-1,i)); slides.forEach((s,j)=>s.classList.toggle('active',j===idx)); [...dots.children].forEach((d,j)=>d.classList.toggle('on',j===idx)); counter.textContent=(idx+1)+' '+dict().ui.of+' '+n; prev.disabled=idx===0; next.disabled=idx===n-1; history.replaceState(null,'','#'+(idx+1)); slides[idx].scrollTop=0; }
  prev.addEventListener('click',()=>go(idx-1)); next.addEventListener('click',()=>go(idx+1));
  langbtn.addEventListener('click',()=>{ if(!BM) return; lang = lang==='en'?'bm':'en'; try{localStorage.setItem('deck-lang',lang);}catch(e){} render(); go(idx); });
  document.addEventListener('keydown',e=>{ if(e.target.closest('input,textarea')) return; if(e.key==='ArrowRight'||e.key===' '||e.key==='PageDown'){e.preventDefault();go(idx+1);} if(e.key==='ArrowLeft'||e.key==='PageUp'){e.preventDefault();go(idx-1);} if(e.key==='Home')go(0); if(e.key==='End')go(n-1); });
  let tx=null; document.getElementById('deck').addEventListener('touchstart',e=>{tx=e.changedTouches[0].clientX;},{passive:true});
  document.getElementById('deck').addEventListener('touchend',e=>{ if(tx===null) return; const dx=e.changedTouches[0].clientX-tx; tx=null; if(Math.abs(dx)>60 && !e.target.closest('figure,button,a')) go(idx+(dx<0?1:-1)); },{passive:true});
  window.addEventListener('hashchange',()=>{ const h=parseInt(location.hash.replace('#',''),10); if(h>=1&&h<=n&&h-1!==idx) go(h-1); });
  render(); go(idx);
})();
</script>

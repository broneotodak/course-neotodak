<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>The plan, step by step — Todak AI Creator Program</title>
<meta name="description" content="A fifteen-step presentation of the Todak AI Creator Program Game Track plan, in English and Bahasa Malaysia, with the Arcade animations of the student’s screen.">
<link rel="stylesheet" href="/documentation/classroom/v1/anim/arcade.css">
<style>
  :root {
    --bg: #e9ebee;
    --surface: #f6f7f8;
    --surface-2: #ffffff;
    --line: #d3d8dd;
    --line-soft: #e0e4e8;
    --ink: #14181c;
    --ink-soft: #545c64;
    --ink-faint: #828d97;
    --method: #37627f;
    --method-soft: rgba(55,98,127,.11);
    --crew: #9a6a1c;
    --crew-soft: rgba(154,106,28,.13);
    --ship: #2c8a66;
    --ship-soft: rgba(44,138,102,.13);
    --elective: #7a5aa0;
    --elective-soft: rgba(122,90,160,.13);
    --shadow: 0 1px 2px rgba(20,24,28,.05), 0 8px 24px rgba(20,24,28,.05);
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0c0e11; --surface: #14181d; --surface-2: #1a1f25; --line: #2a3138; --line-soft: #21272d;
      --ink: #e7eaed; --ink-soft: #9aa4ad; --ink-faint: #69737c;
      --method: #86b2ce; --method-soft: rgba(134,178,206,.13);
      --crew: #d2a052; --crew-soft: rgba(210,160,82,.14);
      --ship: #5cbf95; --ship-soft: rgba(92,191,149,.14);
      --elective: #b298d6; --elective-soft: rgba(178,152,214,.15);
      --shadow: 0 1px 2px rgba(0,0,0,.3), 0 10px 30px rgba(0,0,0,.35);
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0c0e11; --surface: #14181d; --surface-2: #1a1f25; --line: #2a3138; --line-soft: #21272d;
    --ink: #e7eaed; --ink-soft: #9aa4ad; --ink-faint: #69737c;
    --method: #86b2ce; --method-soft: rgba(134,178,206,.13);
    --crew: #d2a052; --crew-soft: rgba(210,160,82,.14);
    --ship: #5cbf95; --ship-soft: rgba(92,191,149,.14);
    --elective: #b298d6; --elective-soft: rgba(178,152,214,.15);
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 10px 30px rgba(0,0,0,.35);
    color-scheme: dark;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    display: grid; grid-template-rows: auto minmax(0, 1fr) auto auto;
    height: 100dvh; overflow: hidden; background: var(--bg); color: var(--ink);
    font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    line-height: 1.5; -webkit-font-smoothing: antialiased;
  }
  button, a { -webkit-tap-highlight-color: transparent; }
  button { font: inherit; cursor: pointer; }
  a { color: var(--method); text-underline-offset: 4px; }
  :where(a, button, [tabindex]):focus-visible { outline: 3px solid var(--method); outline-offset: 4px; }
  button:disabled { opacity: .4; cursor: default; }
  .dtop, .dbot { background: var(--surface); padding-inline: clamp(16px, 3vw, 48px); }
  .dtop {
    display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 20px;
    min-height: 64px; padding-block: 8px; border-bottom: 1px solid var(--line);
    font: 12px/1.4 ui-monospace, Menlo, monospace;
  }
  .dtop > span:first-child { display: flex; align-items: center; flex-wrap: wrap; gap: 0 16px; }
  .dtop a { display: inline-flex; align-items: center; min-height: 44px; color: var(--ink-soft); text-decoration: none; }
  .dtop a:hover { color: var(--method); text-decoration: underline; }
  .dtop .ttl { color: var(--method); text-align: center; }
  .langbtn, .fsbtn {
    min-height: 44px; border: 1px solid var(--line); border-radius: 8px;
    background: var(--surface-2); color: var(--ink); padding: 10px 14px; font-size: 13px;
  }
  .langbtn { justify-self: end; white-space: nowrap; font: inherit; }
  .langbtn b { color: var(--method); }
  .langbtn:hover, .fsbtn:hover { border-color: var(--method); }
  .deck { position: relative; min-height: 0; min-width: 0; }
  .slide { display: none; position: absolute; inset: 0; overflow: auto; overscroll-behavior: contain; padding: clamp(24px, 4vh, 48px) clamp(24px, 5vw, 80px); scrollbar-gutter: stable both-edges; }
  .slide.active { display: block; animation: slide-in .18s ease-out; }
  @keyframes slide-in { from { opacity: 0; } to { opacity: 1; } }
  .inner { width: 100%; max-width: 1120px; margin-inline: auto; }
  .kicker { margin: 0 0 16px; color: var(--crew); font: 12px/1.5 ui-monospace, Menlo, monospace; letter-spacing: .12em; text-transform: uppercase; }
  .slide h1 { margin: 0 0 24px; max-width: 30ch; font-size: clamp(32px, 3.5vw, 50px); font-weight: 750; letter-spacing: -.035em; line-height: 1.12; text-wrap: balance; }
  .points { list-style: none; padding: 0; margin: 0; max-width: 1000px; }
  .points li { position: relative; padding-left: 22px; margin: 0 0 12px; font-size: clamp(18px, 1.6vw, 22px); line-height: 1.5; }
  .points li::before { content: ""; position: absolute; left: 0; top: .62em; width: 6px; height: 6px; border-radius: 50%; background: var(--method); }
  .points li:last-child { margin-bottom: 0; }
  .points:empty, .visual:empty { display: none; }
  .visual { min-width: 0; margin-top: 28px; }
  .slide[data-id="title"] .inner { min-height: 100%; display: flex; flex-direction: column; justify-content: center; }
  .slide[data-id="title"] h1 { max-width: 18ch; font-size: clamp(42px, 5.3vw, 76px); margin-bottom: 32px; }
  .slide[data-id="title"] .points li:last-child { color: var(--ink-soft); font-size: 14px; border-top: 1px solid var(--line); padding: 20px 0 0; margin-top: 32px; max-width: 680px; }
  .slide[data-id="title"] .points li:last-child::before { display: none; }

  /* Supporting visuals share the site's quiet surfaces and type. */
  .bigrow { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }
  .bigrow .big { padding: 24px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); }
  .bigrow .n { color: var(--method); font-size: clamp(48px, 6vw, 80px); line-height: 1; font-weight: 750; letter-spacing: -.05em; font-variant-numeric: tabular-nums; }
  .bigrow .l { margin-top: 14px; color: var(--ink-soft); font: 13px/1.5 ui-monospace, Menlo, monospace; }
  .strip { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 8px; }
  .strip > div { position: relative; display: grid; grid-template-rows: auto 1fr auto; gap: 12px; padding: 16px 12px 24px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); overflow-wrap: anywhere; }
  .strip > div::after { content: ""; position: absolute; height: 3px; bottom: 0; left: 0; width: var(--duration); background: var(--method); }
  .strip .time { font: 13px/1.5 ui-monospace, Menlo, monospace; color: var(--method); }
  .strip b { font-size: 15px; line-height: 1.4; }
  .strip small { font-size: 13px; color: var(--ink-soft); }
  .strip .brk { background: transparent; }
  .strip .brk::after { background: var(--ink-soft); }
  .stairs { display: grid; gap: 10px; counter-reset: rung; }
  .stairs > div { position: relative; counter-increment: rung; padding: 16px 20px 16px 64px; background: var(--surface); border: 1px solid var(--line); border-left: 3px solid var(--ship); border-radius: 8px; }
  .stairs > div::before { content: "0" counter(rung); position: absolute; top: 18px; left: 20px; font: 13px/1.5 ui-monospace, Menlo, monospace; color: var(--ship); }
  .stairs > div:nth-child(2) { margin-left: 3%; } .stairs > div:nth-child(3) { margin-left: 6%; } .stairs > div:nth-child(4) { margin-left: 9%; }
  .stairs b { display: block; font-size: 18px; }
  .stairs small { display: block; margin-top: 4px; font-size: 15px; color: var(--ink-soft); }
  .buyrows { border: 1px solid var(--line); border-radius: 12px; background: var(--surface); overflow: hidden; }
  .buyrows > div { display: grid; grid-template-columns: minmax(0, .9fr) minmax(0, 1.3fr); gap: 24px; padding: 16px 20px; font-size: 17px; }
  .buyrows > div + div { border-top: 1px solid var(--line); }
  .buyrows span:first-child { font-weight: 650; }
  .buyrows span:last-child { color: var(--ink-soft); font-variant-numeric: tabular-nums; }
  .cols { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 20px; }
  .col { background: var(--surface); border: 1px solid var(--line); border-top: 3px solid var(--ship); border-radius: 10px; padding: 24px; }
  .col.open { border-top-color: var(--crew); }
  .col h3 { margin: 0 0 20px; font: 600 13px/1.5 ui-monospace, Menlo, monospace; letter-spacing: .07em; text-transform: uppercase; color: var(--ship); }
  .col.open h3 { color: var(--crew); }
  .col ul { list-style: none; margin: 0; padding: 0; }
  .col li { font-size: 17px; padding: 10px 0; border-top: 1px solid var(--line-soft); }
  .col li:first-child { border: 0; padding-top: 0; }
  .col li:last-child { padding-bottom: 0; }
  .linkrow { display: flex; flex-wrap: wrap; gap: 12px; }
  .linkrow a { display: inline-flex; align-items: center; min-height: 48px; padding: 12px 18px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); color: var(--method); font-size: 16px; font-weight: 650; text-decoration: none; }
  .linkrow a:hover { border-color: var(--method); background: var(--method-soft); }

  /* Bars take their own grid rows, including when links or dots wrap. */
  .dbot { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; align-items: center; gap: 16px; padding-block: 12px max(12px, env(safe-area-inset-bottom)); border-top: 1px solid var(--line); }
  .dbot > button { min-height: 44px; min-width: 104px; border: 1px solid var(--line); border-radius: 8px; padding: 10px 18px; background: var(--surface-2); color: var(--ink); font-size: 14px; font-weight: 650; }
  .dbot > button.primary { background: var(--method); color: var(--surface-2); border-color: var(--method); }
  .dbot > button:not(:disabled):hover { box-shadow: inset 0 0 0 1px var(--method); }
  .prog { min-width: 0; display: flex; align-items: center; justify-content: center; gap: 20px; }
  .dots { display: flex; min-width: 0; flex: 0 1 660px; }
  .dots button { display: grid; place-items: center; flex: 1; min-width: 0; height: 44px; padding: 0; border: 0; background: transparent; border-radius: 6px; }
  .dots button::before { content: ""; width: 7px; height: 7px; border: 1px solid var(--ink-soft); border-radius: 50%; background: transparent; }
  .dots button.on::before { width: 10px; height: 10px; background: var(--method); border-color: var(--method); }
  .dots button:hover { background: var(--method-soft); }
  .dots button:focus-visible { outline-offset: -3px; }
  .counter { color: var(--ink-soft); white-space: nowrap; font: 12px/1.5 ui-monospace, Menlo, monospace; font-variant-numeric: tabular-nums; }

  /* Text and controls reserve their natural size. Only the SVG drawing flexes.
     The min-content tracks grow downwards and the slide scrolls if space runs out. */
  .slide.hero { padding: 20px clamp(24px, 3vw, 48px); }
  .slide.hero .inner { max-width: 1500px; height: 100%; display: grid; grid-template-rows: auto auto auto minmax(min-content, 1fr); }
  .slide.hero .kicker { margin-bottom: 8px; }
  .slide.hero h1 { font-size: clamp(30px, 2.6vw, 40px); margin-bottom: 14px; max-width: none; }
  .slide.hero .points { max-width: 1320px; }
  .slide.hero .points li { font-size: clamp(16px, 1.25vw, 19px); margin-bottom: 4px; }
  .slide.hero .visual { display: grid; grid-template-columns: minmax(0, 1fr) auto; grid-template-rows: auto minmax(min-content, 1fr); align-content: start; gap: 12px 20px; margin-top: 12px; }
  .animnote { grid-column: 1; grid-row: 1; align-self: center; margin: 0; color: var(--ink-soft); font-size: 12px; line-height: 1.5; }
  .fsbtn { grid-column: 2; grid-row: 1; align-self: center; font-weight: 650; }
  .animation-stage { grid-column: 1 / -1; grid-row: 2; display: grid; min-width: 0; }
  .slide.hero .arcade-storyboard { margin: 0; }
  .slide.hero .arcade { margin: 0; display: grid; grid-template-rows: auto minmax(180px, 1fr) auto auto auto auto; padding: 14px; }
  .slide.hero .arcade > svg { min-height: 180px; height: 100%; max-height: 100%; aspect-ratio: auto; contain: size; }
  .slide.hero .arcade-heading { margin-bottom: 12px; }
  .slide.hero .arcade-storyboard .arcade-heading { min-height: 48px; }
  .slide.hero .arcade-help { line-height: 1.5; }
  .slide.hero .visual:fullscreen {
    width: 100%; height: 100%; margin: 0; padding: 20px max(20px, calc((100vw - 1500px) / 2));
    overflow: auto; background: #0c0e11; color-scheme: dark;
  }
  .visual:fullscreen .animnote { color: #9aa4ad; }
  .visual:fullscreen .fsbtn { color: #e7eaed; border-color: #545c64; background: #1a1f25; }
  .visual:fullscreen .fsbtn:focus-visible { outline-color: #86b2ce; }

  @media (max-width: 1100px) {
    .dtop { grid-template-columns: minmax(0, 1fr) auto; }
    .dtop .ttl { display: none; }
    .prog { gap: 8px; }
    .strip { grid-template-columns: repeat(4, minmax(0, 1fr)); }
  }
  @media (max-width: 900px) {
    .slide, .slide.hero { padding: 28px 24px; }
    .slide.hero .inner { display: block; height: auto; }
    .slide.hero .visual { grid-template-rows: auto auto; }
    .slide.hero .arcade { display: block; }
    .slide.hero .arcade > svg { height: auto; min-height: 0; aspect-ratio: auto; contain: none; }
    .slide.hero .arcade-storyboard { grid-template-columns: 1fr; }
    .slide.hero .arcade-storyboard .arcade-heading { min-height: 0; }
    .slide.hero .arcade-storyboard .arcade-dialog { font-size: 14px; }
    .slide.hero .arcade-storyboard .arcade-controls button { flex: initial; font-size: 13px; padding: 8px 12px; }
    .slide.hero .arcade-storyboard .arcade-controls button[data-action="toggle"] { flex: initial; }
    .slide.hero .points li { font-size: 18px; margin-bottom: 10px; }
    .cols { grid-template-columns: 1fr; }
    .strip { grid-template-columns: 1fr; }
    .strip > div { grid-template-columns: 56px minmax(0, 1fr) auto; grid-template-rows: auto; align-items: baseline; padding: 16px; }
    .buyrows > div { grid-template-columns: 1fr; gap: 6px; }
    .stairs > div:nth-child(n) { margin-left: 0; }
    .slide.hero .visual:fullscreen { display: flex; flex-direction: column; align-items: stretch; padding: 16px; gap: 16px; }
    .visual:fullscreen .fsbtn { align-self: flex-end; order: -2; }
    .visual:fullscreen .animnote { order: -1; align-self: stretch; }
    .visual:fullscreen .animation-stage { margin-block: auto; }
    .dbot { gap: 0 12px; padding-block: 4px max(12px, env(safe-area-inset-bottom)); }
    .prog { display: contents; }
    .dots { grid-column: 1 / -1; grid-row: 1; }
    .counter { grid-column: 2; grid-row: 2; text-align: center; }
    #prev { grid-column: 1; grid-row: 2; } #next { grid-column: 3; grid-row: 2; }
  }
  @media (max-width: 560px) {
    .dtop { gap: 12px; padding-block: 4px; font-size: 11px; }
    .dtop > span:first-child { display: grid; }
    .dtop a { min-height: 44px; }
    .langbtn { padding-inline: 12px; }
    .slide, .slide.hero { padding: 24px 18px; }
    .slide h1 { font-size: 34px; margin-bottom: 20px; }
    .kicker { font-size: 11px; }
    .points li { font-size: 18px; padding-left: 18px; }
    .visual { margin-top: 24px; }
    .bigrow { grid-template-columns: 1fr; gap: 10px; }
    .bigrow .big { display: flex; align-items: center; gap: 24px; padding: 20px; }
    .bigrow .n { min-width: 2ch; } .bigrow .l { margin: 0; }
    .col { padding: 20px; }
    .strip > div { grid-template-columns: 46px minmax(0, 1fr); gap: 4px 12px; }
    .strip small { grid-column: 2; }
    .slide.hero .visual { grid-template-columns: 1fr; gap: 12px; }
    .slide.hero .fsbtn { grid-column: 1; grid-row: 2; justify-self: start; }
    .slide.hero .animation-stage { grid-row: 3; }
    .slide.hero .arcade { padding: 10px; }
    .animnote { font-size: 13px; }
    .dbot > button { min-width: 88px; padding-inline: 14px; }
  }
  /* Edit mode: the team changes the points in place and saves for everyone. */
  .tools { justify-self: end; display: flex; align-items: center; gap: 8px; }
  .editing .tools { height: 44px; }
  .editbtn[aria-pressed="true"] { border-color: var(--method); background: var(--method-soft); color: var(--method); }
  .editbtn.dirty { position: relative; }
  .editbtn.dirty::after { content: ""; position: absolute; top: 5px; right: 5px; width: 6px; height: 6px; border-radius: 50%; background: var(--crew); }
  .editbar { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 25ch) auto; align-items: center; gap: 16px; padding: 10px clamp(16px, 3vw, 48px); background: var(--surface); border-top: 1px solid var(--line); font-size: 12px; line-height: 1.4; color: var(--ink-soft); }
  .editbar[hidden] { display: none; }
  .editbar .hint { min-width: 0; display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; overflow: hidden; }
  .editbar .status { min-width: 0; max-height: 40px; overflow: auto; scrollbar-width: thin; color: var(--ink-soft); font-variant-numeric: tabular-nums; }
  .editbar:has(#ed-save:not(:disabled)) .status { color: var(--crew); }
  .editbar .acts { display: flex; align-items: center; gap: 6px; }
  .editbar button { min-height: 40px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface-2); color: var(--ink); padding: 8px 12px; font-size: 13px; line-height: 1.4; font-weight: 600; white-space: nowrap; }
  .editbar button.primary { background: var(--method); color: var(--surface-2); border-color: var(--method); }
  .editbar button.quiet { border-color: transparent; background: transparent; color: var(--ink-soft); font-weight: 500; }
  .editbar button:hover:not(:disabled) { border-color: var(--method); }
  .editbar button.quiet:hover:not(:disabled) { border-color: var(--line); color: var(--ink); }
  .editbar button:disabled { opacity: .55; }
  .editbar button.primary:disabled { background: var(--method-soft); border-color: var(--line); color: var(--ink-soft); opacity: 1; }
  [data-ep] { outline: 1px solid var(--line); outline-offset: 3px; border-radius: 4px; cursor: text; caret-color: var(--method); overflow-wrap: anywhere; }
  [data-ep]:hover { outline-color: var(--method); }
  [data-ep]:focus { outline: 2px solid var(--method); background: var(--surface-2); box-shadow: 0 0 0 5px var(--method-soft); }
  .ed { display: block; min-width: 4ch; }
  .ed:empty::before { content: attr(data-ph); color: var(--ink-soft); }
  .points li.pt, .col li.pt { display: flex; align-items: flex-start; gap: 12px; }
  .pt .ed { flex: 1; min-width: 0; min-height: 36px; }
  .rm { flex: none; width: 36px; height: 36px; padding: 0; border: 1px solid var(--line); border-radius: 6px; background: transparent; color: var(--ink-soft); font-size: 20px; line-height: 1; }
  .rm:hover { background: var(--crew-soft); color: var(--crew); border-color: var(--crew); }
  .add { min-height: 40px; padding: 8px 12px; border: 1px solid var(--line); border-radius: 8px; background: transparent; color: var(--method); font-size: 13px; font-weight: 600; }
  .add:hover { border-color: var(--method); background: var(--method-soft); }
  .points li.addrow::before { display: none; }
  .col li.addrow { border-top: 1px solid var(--line-soft); padding-top: 10px; }
  .dtop .ttl .edited { color: var(--ink-faint); }
  .editing .dtop .ttl .edited { font-variant-numeric: tabular-nums; white-space: nowrap; }
  @media (max-width: 1100px) {
    .editbar { grid-template-columns: minmax(0, 1fr) auto; }
    .editbar .hint { display: none; }
  }
  @media (max-width: 760px) {
    .editbar { grid-template-columns: repeat(10, minmax(0, 1fr)) repeat(2, minmax(24px, 1fr)); grid-template-rows: 38px 42px; gap: 6px; padding-block: 8px; }
    .editbar .status { grid-column: 1 / 7; grid-row: 1; max-height: 38px; font-size: 11px; }
    .editbar .acts { display: contents; }
    .editbar button { min-width: 0; min-height: 0; height: 100%; padding: 4px 6px; font-size: 12px; line-height: 1.25; white-space: normal; }
    #ed-resetall { grid-column: 7 / -1; grid-row: 1; justify-self: end; }
    #ed-reset { grid-column: 1 / 6; grid-row: 2; }
    #ed-save { grid-column: 6 / 11; grid-row: 2; }
    #ed-done { grid-column: 11 / -1; grid-row: 2; }
  }
  @media (max-width: 560px) {
    .tools { gap: 6px; }
    .points li.pt, .col li.pt { gap: 10px; }
    .pt .ed { min-height: 40px; }
    .rm { width: 40px; height: 40px; }
  }
  @media print {
    .editing #editbar, .editing .rm, .editing .addrow { display: none; }
    .editing [data-ep] { outline: none; background: transparent; box-shadow: none; }
  }
  @media (prefers-reduced-motion: reduce) { .slide.active { animation: none; } }
</style>
</head>
<body>
<nav class="dtop" aria-label="Documentation">
  <span><a href="/documentation/summary/v1/" data-ui="summary">The program in five minutes</a><a href="/documentation/" data-ui="docs">All documentation</a></span>
  <span class="ttl">The plan, step by step</span>
  <span class="tools"><button class="langbtn" id="langbtn" type="button" aria-label="Switch language"><b data-lang-cur>EN</b> / <span data-lang-other>BM</span></button><button class="langbtn editbtn" id="editbtn" type="button" aria-pressed="false">Edit</button></span>
</nav>

      if(v==='ladder'){ s.querySelector('.vis-ladder').innerHTML='<div class="stairs">'+sl.ladder.map((r,q)=>'<div><b'+ep(i,'ladder',q,0)+'>'+r[0]+'</b><small'+ep(i,'ladder',q,1)+'>'+r[1]+'</small></div>').join('')+'</div>'; }
      if(v==='buy'){ s.querySelector('.vis-buy').innerHTML='<div class="buyrows">'+sl.buy.map((r,q)=>'<div><span'+ep(i,'buy',q,0)+'>'+r[0]+'</span><span'+ep(i,'buy',q,1)+'>'+r[1]+'</span></div>').join('')+'</div>'; }
      if(v==='status'){ s.querySelector('.vis-status').innerHTML='<div class="cols"><div class="col ok"><h3>'+(lang==='bm'?'Dicadangkan setakat ini':'Proposed so far')+'</h3><ul>'+items(i,'decided',sl.decided)+'</ul></div><div class="col open"><h3>'+(lang==='bm'?'Masih perlu diputuskan':'Still to decide')+'</h3><ul>'+items(i,'open',sl.open)+'</ul></div></div>'; }
      if(v==='links'){ s.querySelector('.vis-links').innerHTML='<div class="linkrow"><a href="/documentation/summary/v1/">'+D.ui.summary+'</a><a href="/documentation/classroom/v2/">'+D.ui.classroom+'</a><a href="/documentation/">'+D.ui.docs+'</a></div>'; }
    });
    Object.keys(D.captions||{}).forEach(k=>{
      if(k.endsWith('_heading')) { const f=document.querySelector('[data-arcade="'+k.replace('_heading','')+'"] figcaption'); if(f) f.innerHTML=D.captions[k]; return; }
      const caps=document.querySelectorAll('[data-arcade="'+k+'"] .arcade-caption'); D.captions[k].forEach((c,i)=>{ if(caps[i]) caps[i].innerHTML=c; });
    });
    updateBar();
  }

  // Wrap the existing, unchanged figures without measuring or shrinking them.
  document.querySelectorAll('.slide.hero .visual').forEach(vis=>{
    const artwork=vis.querySelector(':scope > figure, :scope > .arcade-storyboard');
    const stage=document.createElement('div'); stage.className='animation-stage';
    artwork.before(stage); stage.appendChild(artwork);
    const b=document.createElement('button'); b.type='button'; b.className='fsbtn';
    b.hidden=!document.fullscreenEnabled;
    b.addEventListener('click',async()=>{
      try {
        if(document.fullscreenElement) await document.exitFullscreen();
        else await vis.requestFullscreen();
      } catch(e) {
        const note=vis.querySelector('.animnote');
        note.textContent=dict().ui.fullscreenError; note.setAttribute('role','status');
      }
    });
    vis.appendChild(b);
  });
  function updateFullscreenButtons(){
    document.querySelectorAll('.fsbtn').forEach(b=>{
      const active=document.fullscreenElement===b.closest('.visual');
      b.textContent=dict().ui[active?'exitFull':'full'];
      b.setAttribute('aria-pressed',String(active));
    });
  }
  let fullscreenButton=null;
  document.addEventListener('fullscreenchange',()=>{
    updateFullscreenButtons();
    if(document.fullscreenElement){
      fullscreenButton=document.fullscreenElement.querySelector('.fsbtn');
      document.fullscreenElement.scrollTop=0; fullscreenButton.focus({preventScroll:true});
    } else if(fullscreenButton) fullscreenButton.focus();
  });
  function go(i){
    idx=Math.max(0,Math.min(n-1,i));
    const focusWasInSlide=slides.some(s=>s.contains(document.activeElement));
    slides.forEach((s,j)=>s.classList.toggle('active',j===idx));
    [...dots.children].forEach((d,j)=>{
      d.classList.toggle('on',j===idx);
      if(j===idx) d.setAttribute('aria-current','step'); else d.removeAttribute('aria-current');
    });
    counter.textContent=(idx+1)+' '+dict().ui.of+' '+n;
    prev.disabled=idx===0; next.disabled=idx===n-1;
    history.replaceState(null,'','#'+(idx+1)); slides[idx].scrollTop=0;
    if(focusWasInSlide){ slides[idx].tabIndex=-1; slides[idx].focus({preventScroll:true}); }
  }
  prev.addEventListener('click',()=>go(idx-1)); next.addEventListener('click',()=>go(idx+1));
  langbtn.addEventListener('click',()=>{ if(!BM) return; lang = lang==='en'?'bm':'en'; try{localStorage.setItem('deck-lang',lang);}catch(e){} render(); go(idx); });
  document.addEventListener('keydown',e=>{
    if(e.defaultPrevented || e.altKey || e.ctrlKey || e.metaKey || document.fullscreenElement || e.target.closest('input,textarea,select,[contenteditable="true"],[data-arcade]')) return;
    if(e.key===' ' && e.target.closest('button,a')) return;
    if(e.key==='ArrowRight'||e.key===' '||e.key==='PageDown'){e.preventDefault();go(idx+1);}
    if(e.key==='ArrowLeft'||e.key==='PageUp'){e.preventDefault();go(idx-1);}
    if(e.key==='Home'){e.preventDefault();go(0);} if(e.key==='End'){e.preventDefault();go(n-1);}
  });
  let touch=null;
  const deck=document.getElementById('deck');
  deck.addEventListener('touchstart',e=>{
    if(e.touches.length!==1 || e.target.closest('figure,button,a,[contenteditable="true"]') || document.fullscreenElement) {touch=null;return;}
    const t=e.changedTouches[0]; touch={x:t.clientX,y:t.clientY};
  },{passive:true});
  deck.addEventListener('touchend',e=>{
    if(!touch) return;
    const t=e.changedTouches[0], dx=t.clientX-touch.x, dy=t.clientY-touch.y; touch=null;
    if(Math.abs(dx)>60 && Math.abs(dx)>Math.abs(dy)*1.5) go(idx+(dx<0?1:-1));
  },{passive:true});
  deck.addEventListener('touchcancel',()=>{touch=null;},{passive:true});
  deck.addEventListener('click',e=>{
    if(document.fullscreenElement || e.target.closest('figure,button,a,.arcade-storyboard') || window.getSelection().toString()) return;
    // Honor the existing edge-tap hint without turning text into a click target.
    if(e.target!==slides[idx] && e.target!==slides[idx].querySelector('.inner')) return;
    if(e.clientX<48) go(idx-1); else if(e.clientX>innerWidth-48) go(idx+1);
  });
  window.addEventListener('hashchange',()=>{ const h=parseInt(location.hash.replace('#',''),10); if(h>=1&&h<=n&&h-1!==idx) go(h-1); });
  loadDraft(); rebase(); let started=false; const start=()=>{ if(started) return; started=true; render(); go(idx); };
  loadShared().then(()=>{ if(started){ render(); go(idx); } else start(); }); setTimeout(start,2500);
})();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>Showcase — Todak AI Creator Program</title>
<style>
  :root { --bg:#e9ebee; --surface:#f6f7f8; --line:#d3d8dd; --ink:#14181c; --soft:#545c64; --faint:#828d97; --method:#37627f; --pink:#ff6ba8; color-scheme: light; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg:#0c0e11; --surface:#14181d; --line:#2a3138; --ink:#e7eaed; --soft:#9aa4ad; --faint:#69737c; --method:#86b2ce; color-scheme: dark; } }
  :root[data-theme="dark"] { --bg:#0c0e11; --surface:#14181d; --line:#2a3138; --ink:#e7eaed; --soft:#9aa4ad; --faint:#69737c; --method:#86b2ce; color-scheme: dark; }
  * { box-sizing: border-box; margin: 0; }
  body { background: var(--bg); color: var(--ink); font-family: ui-sans-serif, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; line-height: 1.5; }
  .wrap { max-width: 980px; margin: 0 auto; padding: 0 16px 60px; }
  .top { border-bottom: 1px solid var(--line); font-family: ui-monospace, Menlo, monospace; font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--faint); }
  .top .wrap { display: flex; justify-content: space-between; align-items: center; height: 44px; padding-bottom: 0; }
  .top a { color: var(--soft); text-decoration: none; }
  h1 { font-size: clamp(28px, 5vw, 42px); font-weight: 800; letter-spacing: -.02em; margin: 40px 0 8px; }
  .dek { color: var(--soft); max-width: 640px; margin-bottom: 28px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 14px; }
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 16px 18px; text-decoration: none; color: inherit; display: block; }
  .card:hover { border-color: var(--method); }
  .card .k { font-family: ui-monospace, Menlo, monospace; font-size: 10.5px; letter-spacing: .12em; text-transform: uppercase; color: var(--faint); margin-bottom: 6px; }
  .card h2 { font-size: 20px; letter-spacing: -.01em; margin-bottom: 4px; }
  .card p { color: var(--soft); font-size: 14px; }
  .card .play { display: inline-block; margin-top: 10px; font-weight: 700; color: var(--method); }
  .empty { color: var(--soft); border: 1px dashed var(--line); border-radius: 12px; padding: 24px; }
  .note { font-size: 12.5px; color: var(--faint); margin-top: 28px; }
</style>
</head>
<body>
<div class="top"><div class="wrap"><span><a href="/">← Course</a> · <a href="/documentation/">Documentation</a></span><span style="color:var(--pink)">Showcase · demonstrator</span></div></div>
<div class="wrap">
  <h1>Student games</h1>
  <p class="dek">Every game published through the Todak Game Kit lands here, playable in the browser. Demonstrator, not the kit.</p>
  <div class="grid" id="grid"><div class="empty">No games published yet.</div></div>
  <p class="note">Godot 4 web builds. They need a recent browser; on a phone, use landscape.</p>
</div>
<script>
const TEAM = 'https://broneotodak.github.io/todak-showcase/';
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
Promise.all([
  fetch('games.json', { cache: 'no-store' }).then(r => r.json()).catch(() => []),
  fetch(TEAM + 'games.json', { cache: 'no-store' }).then(r => r.json()).then(l => l.map(g => ({ ...g, path: TEAM + g.path, team: true }))).catch(() => []),
]).then(([site, team]) => {
  const list = [...site, ...team].sort((a, b) => String(a.published).localeCompare(String(b.published)));
  const grid = document.getElementById('grid'); if (!list.length) return;
  grid.innerHTML = list.reverse().map(g => `<a class="card" href="${esc(g.path)}"><div class="k">Week ${esc(g.week)} · ${new Date(g.published).toLocaleDateString('en-GB',{day:'numeric',month:'short'})}${g.team ? ' · team' : ''}</div><h2>${esc(g.name)}</h2><p>by ${esc(g.student)}</p><span class="play">Play →</span></a>`).join('');
});
</script>
</body>
</html>

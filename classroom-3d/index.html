<div class="app">
  <header class="topbar">
    <a class="brand" href="/"><span class="mark" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></span><span><b data-i18n="brand"></b><small data-i18n="edition"></small></span></a>

    <div class="language" role="group"><button id="lang-en" type="button" lang="en" aria-label="English">EN</button><button id="lang-bm" type="button" lang="ms" aria-label="Bahasa Malaysia">BM</button></div>
  </header>
  <main class="stage" id="stage">
    <canvas id="world" tabindex="0"></canvas>
    <div class="stage-header"><span class="eyebrow" data-i18n="district"></span><p data-i18n="world"></p></div>
    <span class="plan" data-i18n="plan"></span>
    <div class="labels" id="labels" aria-hidden="true"></div>
    <div class="inset screen-inset" id="workbench" aria-hidden="true"></div>
    <div class="inset route-inset" id="route" aria-hidden="true"></div>
    <div class="inset dashboard-inset" id="dashboard" aria-hidden="true"></div>
    <div class="inset review-inset" id="review" aria-hidden="true"></div>
    <div class="inset takehome-inset" id="takehome"></div>
    <div class="stage-bottom"><div class="legend" id="legend"></div><span class="orbit-hint" id="orbit-hint"></span></div>
    <div class="loading" id="loading" data-i18n="loading"></div>
    <div class="fallback" id="fallback" hidden><div><h2 data-i18n="fallbackTitle"></h2><p data-i18n="fallbackBody"></p><a href="/documentation/deck/v1/" data-i18n="fallbackLink"></a></div></div>
    <noscript>This animated classroom needs JavaScript. <a href="/documentation/deck/v1/">Open the slides / Buka slaid</a>.</noscript>
  </main>
  <section class="story" id="story" aria-live="polite" aria-atomic="true">
    <div><p class="chapter" id="chapter"></p><h1 id="title"></h1></div>
    <div class="captions"><p id="caption-1"></p><p id="caption-2"></p></div>
  </section>
  <nav class="controls" id="controls">
    <div class="transport"><button class="icon-button" id="previous" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m14 5-7 7 7 7"/></svg></button><button class="icon-button play-button" id="play" type="button"></button><button class="icon-button" id="next" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m10 5 7 7-7 7"/></svg></button></div>
    <span class="count"><b id="count">01</b> / 10</span>
    <div class="stops" id="stops"></div>
    <span class="status" id="status"></span>
    <button class="overview" id="overview" type="button" data-i18n="overview"></button>
  </nav>
  <footer class="footer"><span data-i18n="disclaimer"></span><a href="/documentation/demo/try/" data-i18n="demo"></a></footer>
</div>
<script type="module">
// Local bootstrap also gives module-load failures a readable route to the slides.
import { strings } from './strings.js';
let lang = 'en';
try { lang = localStorage.getItem('classroom-3d-language') === 'bm' ? 'bm' : 'en'; } catch {}
document.querySelectorAll('[data-i18n]').forEach(el => el.textContent = strings[lang][el.dataset.i18n]);
document.documentElement.lang = lang === 'bm' ? 'ms' : 'en';
import('./scene.js').catch(() => {
  document.getElementById('loading').hidden = true;
  document.getElementById('fallback').hidden = false;
  document.querySelectorAll('.controls button').forEach(el => el.disabled = true);
  document.getElementById('title').textContent = strings[lang].fallbackTitle;
  document.getElementById('caption-1').textContent = strings[lang].fallbackBody;
});
</script>
